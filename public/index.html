<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloody Rain Footage</title>
    <!-- Подключаем оригинальную библиотеку анимации p5.js -->
    <script src="https://cloudflare.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0202; /* Оригинальный темно-бордовый оттенок фона */
        }
        /* Закрепляем холст p5.js на весь экран */
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 1;
        }
    </style>
</head>
<body>

    <script>
        // Восстановленные оригинальные массивы элементов
        let drops = [];
        let sparks = [];
        let smogParticles = [];
        
        // Автоматические параметры окружающей среды
        let windX = 0; 
        let targetWindX = 0;
        let globalSpeedMultiplier = 1.2;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            
            // Инициализация оригинального количества элементов
            for (let i = 0; i < 120; i++) drops.push(new Drop());
            for (let i = 0; i < 40; i++) sparks.push(new Spark());
            for (let i = 0; i < 15; i++) smogParticles.push(new Smog());

            // Запуск автоматического изменения ритма погоды каждую минуту (60000 мс)
            setInterval(updateWeatherRhythm, 60000);
            updateWeatherRhythm(); // Задаем начальный хаотичный ритм
        }

        function draw() {
            // Оригинальный шлейф размытия фона
            background(11, 2, 2, 40);

            // Плавное изменение направления ветра
            windX = lerp(windX, targetWindX, 0.02);

            // Отрисовка всех слоев спецэффектов сайта
            smogParticles.forEach(p => { p.update(); p.display(); });
            drops.forEach(d => { d.update(); d.display(); });
            sparks.forEach(s => { s.update(); s.display(); });
        }

        // Автоматический алгоритм хаотичного изменения ритма
        function updateWeatherRhythm() {
            // Хаотично меняем силу и сторону ветра (от -2.5 до 2.5)
            targetWindX = random(-2.5, 2.5);
            
            // Хаотично меняем скорость течения дождя
            globalSpeedMultiplier = random(0.8, 2.0);
        }

        // Оригинальный класс Капли (Drop)
        class Drop {
            constructor() {
                this.reset();
                this.y = random(height);
            }
            reset() {
                this.x = random(-100, width + 100);
                this.y = random(-100, -10);
                this.z = random(0, 20);
                this.len = map(this.z, 0, 20, 10, 25);
                this.yspeed = map(this.z, 0, 20, 4, 9) * globalSpeedMultiplier;
                this.opacity = map(this.z, 0, 20, 30, 120);
                this.weight = map(this.z, 0, 20, 1, 2.5);
            }
            update() {
                this.y += this.yspeed;
                this.x += windX * map(this.z, 0, 20, 0.5, 1.5);
                if (this.y > height || this.x < -100 || this.x > width + 100) {
                    this.reset();
                }
            }
            display() {
                stroke(180, 20, 20, this.opacity); // Кроваво-красные капли
                strokeWeight(this.weight);
                line(this.x, this.y, this.x + windX * 2, this.y + this.len);
            }
        }

        // Улучшенный класс Искры (Spark) с яркой реакцией на ветер
        class Spark {
            constructor() {
                this.reset();
                this.y = random(height);
            }
            reset() {
                this.x = random(width);
                this.y = height + random(10, 100);
                this.size = random(4, 8); // Сделали искры крупнее (было 2-5)
                this.speedX = random(-1.5, 1.5);
                this.speedY = random(-2, -5); // Летят чуть быстрее вверх
                this.alpha = random(150, 255); // Сделали их ярче и насыщеннее
            }
            update() {
                this.y += this.speedY;
                // Усилили влияние ветра (теперь они сильно наклоняются вбок вслед за дождем)
                this.x += this.speedX + windX * 1.2; 
                this.alpha -= 1.2; // Живут на экране чуть дольше
                if (this.alpha <= 0 || this.y < -10) {
                    this.reset();
                }
            }
            display() {
                noStroke();
                // Насыщенный светящийся огненно-красный цвет
                fill(255, 50, 50, this.alpha); 
                ellipse(this.x, this.y, this.size);
            }
        }

        // Оригинальный класс Кровавого Тумана (Smog)
        class Smog {
            constructor() {
                this.reset();
                this.x = random(width);
                this.y = random(height);
            }
            reset() {
                this.x = windX > 0 ? random(-200, 0) : random(width, width + 200);
                this.y = random(height);
                this.size = random(150, 350);
                this.speedX = random(0.2, 0.8) * (windX >= 0 ? 1 : -1);
                this.alpha = random(5, 18);
            }
            update() {
                this.x += this.speedX + windX * 0.3;
                if (this.x > width + 200 || this.x < -200) {
                    this.reset();
                }
            }
            display() {
                noStroke();
                fill(139, 0, 0, this.alpha); // Объёмные частицы тумана
                ellipse(this.x, this.y, this.size);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
