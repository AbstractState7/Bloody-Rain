<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>RED RAID</title>



  <!-- Стили сайта (CSS) -->
  <style>
    body {
      background-color: #121212; /* Наш темный фон */
      color: #e0e0e0;
      font-weight: bold;
      font-size: 20px;
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      box-sizing: border-box;
      position: relative;
    }
   
    .modal-overlay img {
      max-width: 90%;
      max-height: 90%;
      border: 2px solid #ff3333; /* Наша фирменная красная рамка */
      box-shadow: 0 0 30px rgba(255, 51, 51, 0.5);
      border-radius: 8px;
      animation: zoomIn 0.25s ease-out; /* Плавное появление из центра */
    }

    @keyframes zoomIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }


    .screenshot-item {
      position: relative;
      overflow: hidden;
      border-radius: 6px;
      border: 2px solid #222 !important; /* Темная рамка в покое */
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      aspect-ratio: 16 / 9;
    }

    .screenshot-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
      filter: grayscale(40%) brightness(75%) contrast(110%) !important; /* Мрачный игровой контраст */
    }

   
    .screenshot-item:hover img {
      transform: scale(1.08);
      filter: grayscale(0%) brightness(105%) contrast(100%) !important; /* Проявление цвета */
    }


    /* ХОЛСТ ДЛЯ КРОВАВОГО ДОЖДЯ */
    #rainCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1; /* Сидит строго ПЕРЕД видео, но ЗА текстом */
      pointer-events: none; /* Мышка кликает сквозь дождь */
    }

    /* Правило для шляпы: центрируем всё содержимое */
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 0;
    }

    /* Контраст 150% + четырехсторонний черный барьер, который полностью съедает белые точки */
    @keyframes neonPulse {
      0% {
        filter: contrast(150%) brightness(90%)
        drop-shadow(1px 1px 1px #000)
        drop-shadow(-1px -1px 1px #000)
        drop-shadow(1px -1px 1px #000)
        drop-shadow(-1px 1px 1px #000)
        drop-shadow(0 0 15px rgba(255, 51, 51, 0.4));
      }
      50% {
        filter: contrast(150%) brightness(90%)
        drop-shadow(1px 1px 1px #000)
        drop-shadow(-1px -1px 1px #000)
        drop-shadow(1px -1px 1px #000)
        drop-shadow(-1px 1px 1px #000)
        drop-shadow(0 0 40px rgba(255, 51, 51, 0.95));
      }
      100% {
        filter: contrast(150%) brightness(90%)
        drop-shadow(1px 1px 1px #000)
        drop-shadow(-1px -1px 1px #000)
        drop-shadow(1px -1px 1px #000)
        drop-shadow(-1px 1px 1px #000)
        drop-shadow(0 0 15px rgba(255, 51, 51, 0.4));
      }
    }

    h1 {
      color: #ff3333;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(255, 51, 51, 0.5); /* Небольшой отсвет для текста */
    }

    header p {
      margin: 10px 0 0 0;
      font-size: 18px;
      color: #a0a0a0;
    }

    header b {
      color: #ff3333;
    }

    /* Полупрозрачный контейнер для разделов сайта */
    main {
      flex-grow: 1;
      max-width: 600px;
      width: 100%;
      margin: 20px auto;
    }

    /* Стиль для карточек-разделов */
    section {
      background: rgba(22, 22, 26, 0.85); /* Чуть плотнее, чтобы дождь не мешал читать */
      backdrop-filter: blur(5px); /* Размытие видео позади карточки */
      border: 1px solid rgba(255, 51, 51, 0.15); /* Едва заметная красная рамка */
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    section h2 {
      color: #ff3333;
      margin-top: 0;
      font-size: 22px;
      border-bottom: 1px solid rgba(255, 51, 51, 0.3);
      padding-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
      opacity: 0.25;

<!-- Холст для капель дождя -->
<canvas id="rainCanvas"></canvas>

<header>
  <img src="./public/red_raid-removebg-preview.png" alt="Логотип RED RAID">
  <h1>PLAYER KILLER сообщество</h1>
  <p>СВОБОДА <b>«АБСТРАКЦИЯ»</b> Романтика</p>
</header>
<!-- СКРИПТ ДЛЯ КРОВАВОГО ДОЖДЯ -->
<script>
  window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('rainCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const maxDrops = 60;
    const drops = [];

    for (let i = 0; i < maxDrops; i++) {
      drops.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        length: Math.random() * 15 + 10,
        speed: Math.random() * 4 + 3
      });
    }

    function drawRain() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(204, 0, 0, 0.45)';
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';

      for (let i = 0; i < maxDrops; i++) {
        const d = drops[i];
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x, d.y + d.length);
        ctx.stroke();

        d.y += d.speed;

        if (d.y > canvas.height) {
          d.y = -d.length;
          d.x = Math.random() * canvas.width;
          d.speed = Math.random() * 4 + 3;
        }
      }
      requestAnimationFrame(drawRain);
    }
    drawRain();
    // ЛОГИКА ОТКРЫТИЯ КАРТИНОК ПО КЛИКУ
    const modal = document.getElementById('imageModal');
    const modalImg = modal.querySelector('img');
    const items = document.querySelectorAll('.screenshot-grid .screenshot-item img');

    // Клик по любой картинке в галерее
    items.forEach(img => {
      img.parentElement.addEventListener('click', () => {
        modal.style.display = 'flex';
        modalImg.src = img.src; // Перекидываем путь картинки в модалку
      });
    });

    // Клик в любое место черного экрана закрывает его обратно
    modal.addEventListener('click', () => {
      modal.style.display = 'none';
    });
  });
</script>
<!-- Контейнер для полноэкранного просмотра -->
<div id="imageModal" class="modal-overlay"><img></div>
</body>
</html>
