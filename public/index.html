<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloody Rain & Sparks Footage</title>
    <!-- Подключаем правильную и рабочую библиотеку анимации p5.js -->
    <script src="https://cloudflare.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0202; /* Фирменный темно-бордовый фон */
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 1;
        }
    </style>
</head>
<body>

    <script>
        let drops = [];
        let sparks = [];
        let smogParticles = [];
        
        // Параметры ветра и скорости
        let windX = 0; 
        let targetWindX = 0;
        let globalSpeedMultiplier = 1.2;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            
            // Создаем элементы: 120 капель, 50 ярких искр и 15 облаков тумана
            for (let i = 0; i < 120; i++) drops.push(new Drop());
            for (let i = 0; i < 50; i++) sparks.push(new Spark());
            for (let i = 0; i < 15; i++) smogParticles.push(new Smog());

            // Запуск автоматического изменения ритма ровно каждую минуту (60000 мс)
            setInterval(updateWeatherRhythm, 60000);
            updateWeatherRhythm(); 
        }

        function draw() {
            // Красивый шлейф размытия (эффект темноты)
            background(11, 2, 2, 40);

            // Плавный переход ветра к новому значению
            windX = lerp(windX, targetWindX, 0.015);

            // Рисуем все слои эффектов
            smogParticles.forEach(p => { p.update(); p.display(); });
            drops.forEach(d => { d.update(); d.display(); });
            sparks.forEach(s => { s.update(); s.display(); });
        }

        // Функция, которая создает тысячи комбинаций бури каждую минуту
        function updateWeatherRhythm() {
            // Случайный ветер: может дуть сильно влево (-3.5) или сильно вправо (3.5)
            targetWindX = random(-3.5, 3.5);
            
            // Случайная скорость дождя и искр: от ленивого течения до бешеного шторма
            globalSpeedMultiplier = random(0.6, 2.3);
        }

        // Класс Кровавого Дождя
        class Drop {
            constructor() {
                this.reset();
                this.y = random(height);
            }
            reset() {
                this.x = random(-150, width + 150);
                this.y = random(-100, -10);
                this.z = random(0, 20);
                this.len = map(this.z, 0, 20, 12, 28);
                this.yspeed = map(this.z, 0, 20, 4, 10) * globalSpeedMultiplier;
                this.opacity = map(this.z, 0, 20, 40, 140);
                this.weight = map(this.z, 0, 20, 1.2, 2.8);
            }
            update() {
                this.y += this.yspeed;
                this.x += windX * map(this.z, 0, 20, 0.6, 1.6);
                if (this.y > height || this.x < -150 || this.x > width + 150) {
                    this.reset();
                }
            }
            display() {
                stroke(190, 20, 20, this.opacity);
                strokeWeight(this.weight);
                // Наклон капли идеально зависит от текущего ветра windX
                line(this.x, this.y, this.x + windX * 2.5, this.y + this.len);
            }
        }

        // Класс Крупных Искр и Пепла (летят снизу вверх и сносятся ветром)
        class Spark {
            constructor() {
                this.reset();
                this.y = random(height);
            }
            reset() {
                this.x = random(width);
                this.y = height + random(10, 100);
                this.size = random(4, 9); // Крупный размер для комфорта глаз
                this.speedX = random(-1.5, 1.5);
                this.speedY = random(-1.5, -4.5) * globalSpeedMultiplier; // Скорость зависит от ритма
                this.alpha = random(160, 255); // Высокая яркость
            }
            update() {
                this.y += this.speedY;
                // Искры теперь СИЛЬНО реагируют на ветер дождя и летят по диагонали
                this.x += this.speedX + windX * 1.4; 
                this.alpha -= 1.0; 
                if (this.alpha <= 0 || this.y < -10 || this.x < -50 || this.x > width + 50) {
                    this.reset();
                }
            }
            display() {
                noStroke();
                // Насыщенный светящийся огненно-красный пепел
                fill(255, 55, 55, this.alpha);
                ellipse(this.x, this.y, this.size);
            }
        }

        // Класс Объемного Красного Смога/Тумана на заднем фоне
        class Smog {
            constructor() {
                this.reset();
                this.x = random(width);
                this.y = random(height);
            }
            reset() {
                this.x = windX > 0 ? random(-250, 0) : random(width, width + 250);
                this.y = random(height);
                this.size = random(180, 380);
                this.speedX = random(0.2, 0.7) * (windX >= 0 ? 1 : -1);
                this.alpha = random(6, 20);
            }
            update() {
                this.x += this.speedX + windX * 0.4;
                if (this.x > width + 250 || this.x < -250) {
                    this.reset();
                }
            }
            display() {
                noStroke();
                fill(120, 0, 0, this.alpha);
                ellipse(this.x, this.y, this.size);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
