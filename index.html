<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloody Rain Footage</title>
    <style>
        /* Очищаем страницу и делаем фон полностью чёрным */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        /* Растягиваем холст с дождем на абсолютно весь экран */
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Только холст для анимации, никакого лишнего HTML-текста -->
    <canvas id="rainCanvas"></canvas>

    <script>
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Базовые настройки капель (вытащены из вашего оригинального JS)
        const drops = [];
        const maxDrops = 150; 

        // Переменные динамики окружающей среды
        let wind = 1.5;         // Скорость ветра по умолчанию
        let globalSpeed = 4;    // Базовая скорость течения дождя
        let rhythmInterval = 60000; // Интервал хаотичного изменения ритма (1 минута)

        class Drop {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height; // Случайный старт по высоте при первой загрузке
            }

            reset() {
                this.x = Math.random() * (canvas.width + 200) - 100;
                this.y = -20;
                this.length = Math.random() * 20 + 15;
                this.speed = Math.random() * 4 + globalSpeed;
                this.opacity = Math.random() * 0.4 + 0.2;
            }

            update() {
                this.y += this.speed;
                this.x += wind; // Ветер смещает каплю по горизонтали

                if (this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(255, 0, 0, ${this.opacity})`; // Фирменный кроваво-красный цвет
                ctx.lineWidth = 1.5;
                ctx.moveTo(this.x, this.y);
                // Наклон капли рассчитывается автоматически исходя из силы ветра
                ctx.lineTo(this.x + wind * 2, this.y + this.length);
                ctx.stroke();
            }
        }

        // Инициализация пула капель
        for (let i = 0; i < maxDrops; i++) {
            drops.push(new Drop());
        }

        // Тот самый алгоритм хаотичного изменения ритма и направления ветра
        function changeWeatherRhythm() {
            // Ветер случайно меняется от сильного левого (-3) до сильного правого (3)
            wind = (Math.random() * 6) - 3; 
            
            // Скорость течения дождя хаотично падает или разгоняется от 3 до 8
            globalSpeed = Math.random() * 5 + 3;

            // Капли адаптируют свою индивидуальную скорость под новый ритм
            drops.forEach(drop => {
                drop.speed = Math.random() * 4 + globalSpeed;
            });
            
            console.log(`Ритм изменился! Текущий ветер: ${wind.toFixed(2)}, Скорость течения: ${globalSpeed.toFixed(2)}`);
        }

        // Запускаем хаотичное изменение ветра и скорости ровно каждую минуту
        setInterval(changeWeatherRhythm, rhythmInterval);
        // Вызываем один раз при старте, чтобы задать случайный начальный ритм
        changeWeatherRhythm();

        // Главный цикл анимации
        function animate() {
            // Эффект шлейфа (капли красиво размываются, а не просто стираются)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < drops.length; i++) {
                drops[i].update();
                drops[i].draw();
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
