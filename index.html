<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloody Rain & Sparks Footage</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0b0202; }
        canvas { display: block; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
    </style>
</head>
<body>

    <canvas id="rainCanvas"></canvas>

    <script>
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let drops = [];
        let sparks = [];
        let windX = 0;
        let targetWindX = 0;
        let speedMultiplier = 1.2;

        // Создаем капли дождя
        for (let i = 0; i < 120; i++) {
            drops.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vel: Math.random() * 5 + 4,
                len: Math.random() * 15 + 10,
                opacity: Math.random() * 0.4 + 0.2
            });
        }

        // Создаем искры / пепел
        for (let i = 0; i < 50; i++) {
            sparks.push({
                x: Math.random() * window.innerWidth,
                y: window.innerHeight + Math.random() * 100,
                size: Math.random() * 4 + 4,
                speedY: Math.random() * -3 - 1.5,
                speedX: Math.random() * 2 - 1,
                alpha: Math.random() * 0.5 + 0.5
            });
        }

        function updateWeather() {
            targetWindX = (Math.random() * 5) - 2.5;
            speedMultiplier = Math.random() * 1.2 + 0.6;
        }
        setInterval(updateWeather, 60000);
        updateWeather();

        function animate() {
            // Эффект темноты и шлейфа
            ctx.fillStyle = 'rgba(11, 2, 2, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            windX += (targetWindX - windX) * 0.015;

            // Рисуем дождь
            ctx.strokeStyle = 'rgba(180, 20, 20, 0.6)';
            ctx.lineWidth = 1.5;
            drops.forEach(d => {
                d.y += d.vel * speedMultiplier;
                d.x += windX;

                if (d.y > canvas.height) {
                    d.y = -20;
                    d.x = Math.random() * canvas.width;
                }

                ctx.beginPath();
                ctx.moveTo(d.x, d.y);
                ctx.lineTo(d.x + windX * 2, d.y + d.len);
                ctx.stroke();
            });

            // Рисуем искры (пепел), летящие снизу вверх
            sparks.forEach(s => {
                s.y += s.speedY;
                s.x += s.speedX + windX * 1.5;
                s.alpha -= 0.005;

                if (s.y < -10 || s.alpha <= 0) {
                    s.y = canvas.height + Math.random() * 50;
                    s.x = Math.random() * canvas.width;
                    s.alpha = Math.random() * 0.5 + 0.5;
                }

                ctx.beginPath();
                ctx.fillStyle = `rgba(255, 55, 55, ${s.alpha})`;
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
